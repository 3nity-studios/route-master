name: Build and Release

on:
  push:
    tags:
      - 'v*'

# Otorga permisos explícitos de escritura para crear releases en GitHub
permissions:
  contents: write

jobs:
  build-linux:
    name: Build on Ubuntu (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfreetype-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libgl-dev \
            libflac-dev \
            libvorbis-dev \
            libopenal-dev \
            zip

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build build --config Release

      - name: Package Release (.zip)
        run: |
          # 1. Create a clean temporary directory outside the project root
          mkdir -p /tmp/package_dir

          # 2. Copy the compiled executable(s)
          if [ -d "build/bin" ]; then
            cp -r build/bin/* /tmp/package_dir/
          elif [ -f "build/route-master_exe" ]; then
            cp build/route-master_exe /tmp/package_dir/
          fi

          # 3. Copy assets into the package directory if it exists
          if [ -d "assets" ]; then
            cp -r assets /tmp/package_dir/
          fi

          # 4. Zip the packaged contents into the workspace root
          cd /tmp/package_dir
          zip -r "${{ github.workspace }}/RouteMaster-${{ github.ref_name }}-Linux.zip" .

      - name: Upload Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: RouteMaster-*.zip
          generate_release_notes: false

      - name: Upload Artifact for Itch.io
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: RouteMaster-*.zip
          retention-days: 1

  publish-itch:
    name: Publish to Itch.io
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux Build
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: itchio-builds

      - name: Push Linux to Itch.io
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: SebastianRami32
          ITCH_GAME: route-master
          CHANNEL: linux
          PACKAGE: itchio-builds/RouteMaster-${{ github.ref_name }}-Linux.zip
          VERSION: ${{ github.ref_name }}
